name: LLM integration

# Optional billable smoke test against real codex-acp.
# Requires repository secret OPENAI_API_KEY (or CODEX_API_KEY).
# Enable manually from Actions → LLM integration → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-integration:
    if: vars.R3_DOCTOR_LLM_INTEGRATION == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R3_DOCTOR_LLM_INTEGRATION: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - name: Install codex-acp CLI
        run: npm install -g @agentclientprotocol/codex-acp
      - name: Probe codex via llm list --inspect
        run: |
          node dist/cli.js llm list --inspect --provider codex --format json \
            | tee "$RUNNER_TEMP/llm-catalog.json"
          node scripts/verify-llm-catalog.mjs --probe codex "$RUNNER_TEMP/llm-catalog.json"
      - name: Publish LLM provider summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llm-catalog.json" ]; then
            echo "### LLM provider probe" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const report = JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/llm-catalog.json', 'utf8'));
              for (const provider of report.providers) {
                const suffix = provider.inspect.status === 'available'
                  ? 'status=available'
                  : 'status=' + provider.inspect.status + (provider.inspect.reason ? ' reason=' + provider.inspect.reason : '');
                console.log('- ' + provider.id + ' (' + provider.displayName + '): ' + suffix);
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Real CLI semantic smoke test
        run: npm run smoke:llm-integration
